# ADR-048: Terraform for an environment's droplet, firewall, reserved IP and DNS. A pull request
# touching infra/terraform plans; a merge to main applies. Each environment runs only while its
# repository variable is true (STAGING_INFRA_ENABLED, PRODUCTION_INFRA_ENABLED), so nothing is
# created before the owner asks. A manual run can also destroy, which staging does after a
# rehearsal.
#
# Per -infra GitHub Environment (staging-infra, production-infra): secrets DO_TOKEN and
# CLOUDFLARE_TOKEN, variable INFRA_SSH_PUBLIC_KEY. Repository secrets
# TERRAFORM_SPACES_ACCESS_KEY_ID and TERRAFORM_SPACES_SECRET_ACCESS_KEY: a Spaces key for the state
# bucket, used by this repo only.
name: Terraform

on:
  pull_request:
    paths: ['infra/terraform/**', '.github/workflows/terraform.yml']
  push:
    branches: [main]
    paths: ['infra/terraform/**', '.github/workflows/terraform.yml']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      action:
        type: choice
        options: [plan, apply, destroy]
        default: plan

jobs:
  staging:
    # Only the chosen environment on a manual run; only while its switch is on.
    if: >-
      vars.STAGING_INFRA_ENABLED == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging-infra
    defaults:
      run:
        working-directory: infra/terraform/environments/staging
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
      TF_VAR_cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
      TF_VAR_ssh_public_key: ${{ vars.INFRA_SSH_PUBLIC_KEY }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -input=false
      - name: Plan
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
        run: terraform plan -input=false -out=plan.tfplan
      - name: Apply
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: terraform apply -input=false plan.tfplan
      - name: Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve

  production:
    # Only the chosen environment on a manual run; only while its switch is on.
    if: >-
      vars.PRODUCTION_INFRA_ENABLED == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment: production-infra
    defaults:
      run:
        working-directory: infra/terraform/environments/production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
      TF_VAR_cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
      TF_VAR_ssh_public_key: ${{ vars.INFRA_SSH_PUBLIC_KEY }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -input=false
      - name: Plan
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
        run: terraform plan -input=false -out=plan.tfplan
      - name: Apply
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: terraform apply -input=false plan.tfplan
      - name: Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve
