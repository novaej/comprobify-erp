# ADR-048, ADR-051: Terraform outside a merge or a release. A pull request touching infra/terraform plans each
# environment that is up; a manual run plans, applies or destroys one, which is how an environment
# is brought up and how staging is torn down after a rehearsal. Merges to main apply through
# main.yml, releases through production.yml. Each environment runs only while its repository
# variable is true (STAGING_INFRA_ENABLED, PRODUCTION_INFRA_ENABLED).
name: Infrastructure
# What a run does, in the list: a pull request's plan, or a manual action on one environment.
run-name: >-
  ${{ github.event_name == 'pull_request'
    && format('Plan for #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title)
    || format('{0} {1}', inputs.action, inputs.environment) }}

on:
  pull_request:
    paths: ['infra/terraform/**', '.github/workflows/infrastructure*.yml']
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
      action:
        type: choice
        options: [plan, apply, destroy]
        default: plan

jobs:
  staging:
    if: >-
      vars.STAGING_INFRA_ENABLED == 'true' &&
      (github.event_name == 'pull_request' || inputs.environment == 'staging')
    uses: ./.github/workflows/infrastructure-job.yml
    with:
      environment: staging
      action: ${{ github.event_name == 'pull_request' && 'plan' || inputs.action }}
    secrets: inherit

  production:
    if: >-
      vars.PRODUCTION_INFRA_ENABLED == 'true' &&
      (github.event_name == 'pull_request' || inputs.environment == 'production')
    uses: ./.github/workflows/infrastructure-job.yml
    with:
      environment: production
      action: ${{ github.event_name == 'pull_request' && 'plan' || inputs.action }}
    secrets: inherit
