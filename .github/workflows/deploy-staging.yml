# ADR-051: deploys main to staging, by hand (`gh workflow run deploy-staging.yml`, or Actions →
# Deploy to staging → Run workflow), so the owner picks the moment and several merges can go
# together. It deploys main's newest commit whose Main run passed (E2E, and Terraform when it
# changed). Main still running, or failed, on main's latest commit refuses; commits after it that
# change only docs have no Main run and change nothing in the app.
name: Deploy to staging

on:
  workflow_dispatch:

# No lock here: the deploy it calls takes deploy-<environment> itself, and a lock of the same name
# held by this run would leave that job waiting on its own parent, which GitHub ends instead.

permissions:
  contents: read

jobs:
  pick:
    name: Pick the commit
    if: vars.STAGING_INFRA_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.pick.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          HEAD: ${{ github.sha }}
        run: |
          [ "$REF" = refs/heads/main ] || { echo "::error::Run it from main, not $REF."; exit 1; }
          # The newest push runs of Main on main: commit, status, conclusion.
          runs=$(gh api "repos/$REPO/actions/workflows/main.yml/runs?branch=main&event=push&per_page=50" \
            --jq '.workflow_runs[] | "\(.head_sha) \(.status) \(.conclusion)"')
          head_run=$(printf '%s\n' "$runs" | awk -v sha="$HEAD" '$1 == sha' | head -1)
          if [ -n "$head_run" ]; then
            read -r _ status conclusion <<< "$head_run"
            [ "$status" = completed ] || { echo "::error::Main is still running on $HEAD: wait for it."; exit 1; }
            [ "$conclusion" = success ] || { echo "::error::Main failed on $HEAD ($conclusion): fix it on main first."; exit 1; }
            commit=$HEAD
          else
            # No Main run: the commits since the last good one may only change docs.
            commit=$(printf '%s\n' "$runs" | awk '$2 == "completed" && $3 == "success" { print $1; exit }')
            [ -n "$commit" ] || { echo '::error::No Main run has passed on main yet.'; exit 1; }
            app=$(git diff --name-only "$commit" "$HEAD" | grep -Ev '^(docs/|apps/docs/)|\.md$' || true)
            [ -z "$app" ] || { echo "::error::$HEAD has app changes with no Main run: $app"; exit 1; }
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          {
            echo '## Deploying to staging'
            echo
            echo "Commit \`$commit\`, the newest on \`main\` whose Main run passed."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: pick
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      ref: ${{ needs.pick.outputs.commit }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
