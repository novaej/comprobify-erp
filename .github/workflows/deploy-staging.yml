# ADR-048: staging follows main while it is up, once CI has passed on the commit and, when the
# push changed the infrastructure, once its Terraform run has been approved and applied. Both
# workflows trigger this one; whichever finishes last deploys, so a hostname or a resize is in
# place before the app that needs it.
# STAGING_INFRA_ENABLED (a repository variable) turns staging's infrastructure and its deploys on
# and off together. A manual run deploys the latest main at once.
name: Deploy staging

on:
  workflow_run:
    workflows: [CI, Terraform]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  # Is everything the commit started done and green? Asked of GitHub, not of the triggering run.
  ready:
    if: >-
      vars.STAGING_INFRA_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo deploy=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The latest push run of a workflow on this commit: none, or its status and conclusion.
          state() {
            gh api "repos/${{ github.repository }}/actions/workflows/$1/runs?head_sha=$SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | if . == null then "none" else "\(.status)/\(.conclusion)" end'
          }
          ci=$(state ci.yml)
          terraform=$(state terraform.yml)
          echo "CI: $ci; Terraform: $terraform"
          # A skipped Terraform job (its switch off) still ends the run as a success.
          if [ "$ci" = completed/success ] && { [ "$terraform" = none ] || [ "$terraform" = completed/success ]; }; then
            echo deploy=true >> "$GITHUB_OUTPUT"
          else
            echo "Not yet: the other run deploys when it finishes, or one of them failed."
            echo deploy=false >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: ready
    if: needs.ready.outputs.deploy == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      ref: ${{ github.event.workflow_run.head_sha || github.sha }}
    secrets: inherit
    permissions:
      contents: read
      packages: write
