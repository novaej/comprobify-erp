# ADR-048: one Terraform run on one environment, called by terraform.yml (pull requests and manual
# runs), staging.yml and production.yml. It runs in the environment's -infra GitHub Environment,
# whose reviewer approves it first.
#
# Per -infra Environment (staging-infra, production-infra): secrets DO_TOKEN and CLOUDFLARE_TOKEN,
# variable INFRA_SSH_PUBLIC_KEY. Repository secrets TERRAFORM_SPACES_ACCESS_KEY_ID and
# TERRAFORM_SPACES_SECRET_ACCESS_KEY: a Spaces key for the state bucket, used by this repo only.
name: Terraform run

on:
  workflow_call:
    inputs:
      environment:
        description: staging or production
        type: string
        required: true
      action:
        description: plan, apply or destroy
        type: string
        required: true
      ref:
        description: The commit or tag whose configuration runs; the triggering one when empty.
        type: string
        default: ''

jobs:
  terraform:
    name: ${{ inputs.action }} ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-infra
    # Two runs on one state would fight over its lock.
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/terraform/environments/${{ inputs.environment }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TERRAFORM_SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TERRAFORM_SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
      TF_VAR_cloudflare_token: ${{ secrets.CLOUDFLARE_TOKEN }}
      TF_VAR_ssh_public_key: ${{ vars.INFRA_SSH_PUBLIC_KEY }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive ../..
      - run: terraform init -input=false
      - name: Plan
        if: inputs.action != 'destroy'
        run: terraform plan -input=false -out=plan.tfplan
      - name: Apply
        if: inputs.action == 'apply'
        run: terraform apply -input=false plan.tfplan
      - name: Destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -input=false -auto-approve
