# ADR-048: builds the image for a commit, pushes it to GHCR and releases it on an environment's
# droplet: migrate first (a failure stops here, the running version stays), then web, worker and
# Caddy, then waits for /health. Called by staging.yml and production.yml.
#
# Per GitHub Environment (staging, production):
#   secrets  DROPLET_IP            the reserved IP (terraform output reserved_ip)
#            INFRA_SSH_PRIVATE_KEY the deploy key's private half
#            RUNTIME_ENV           the whole .env of the environment, one variable per line
#                                  (docs/deployment.md lists them)
#            DATABASE_CA_CERT      the managed cluster's CA certificate (ca-certificate.crt)
# Everything else (the deploy user, the hostnames, the containers' limits) comes from the
# environment's infra/terraform/environments/<env>/terraform.tfvars, the one place it is set.
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      ref:
        description: The commit or tag to release.
        type: string
        required: true

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      # The settings Terraform's tfvars already hold, read once for the steps below.
      - name: Read the environment's settings
        id: settings
        env:
          TFVARS: infra/terraform/environments/${{ inputs.environment }}/terraform.tfvars
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          text = open(os.environ['TFVARS']).read()
          def value(name):
              found = re.search(rf'^{name}\s*=\s*"([^"]*)"', text, re.M)
              if not found: raise SystemExit(f'{name} is missing from terraform.tfvars')
              return found.group(1)
          hosts = re.search(r'^hostnames\s*=\s*\[([^\]]*)\]', text, re.M)
          if not hosts: raise SystemExit('hostnames is missing from terraform.tfvars')
          print('deploy_username=' + value('deploy_username'))
          # Caddy's site address: the hostnames, comma-separated.
          print('site_hosts=' + ', '.join(re.findall(r'"([^"]+)"', hosts.group(1))))
          for name in ('web_memory', 'worker_memory', 'worker_cpus'):
              print(f'{name}={value(name)}')
          PY

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      # Pinned to commit SHAs: these steps hold the deploy key and every runtime secret, and a
      # moved tag would run someone else's code with them.
      - name: Copy the stack to the droplet
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ steps.settings.outputs.deploy_username }}
          key: ${{ secrets.INFRA_SSH_PRIVATE_KEY }}
          source: infra/deploy/compose.yaml,infra/deploy/caddy/Caddyfile
          target: /opt/comprobify
          strip_components: 2

      - name: Migrate, start, wait for health
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          RUNTIME_ENV: ${{ secrets.RUNTIME_ENV }}
          DATABASE_CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SITE_HOSTS: ${{ steps.settings.outputs.site_hosts }}
          WEB_MEMORY: ${{ steps.settings.outputs.web_memory }}
          WORKER_MEMORY: ${{ steps.settings.outputs.worker_memory }}
          WORKER_CPUS: ${{ steps.settings.outputs.worker_cpus }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ steps.settings.outputs.deploy_username }}
          key: ${{ secrets.INFRA_SSH_PRIVATE_KEY }}
          envs: IMAGE,RUNTIME_ENV,DATABASE_CA_CERT,GHCR_TOKEN,GHCR_USER,SITE_HOSTS,WEB_MEMORY,WORKER_MEMORY,WORKER_CPUS
          script: |
            set -euo pipefail
            cd /opt/comprobify
            umask 077
            printf '%s\n' "$RUNTIME_ENV" > .env
            # Public, not secret: readable by the containers' own user.
            if [ -z "$DATABASE_CA_CERT" ]; then echo 'DATABASE_CA_CERT is not set'; exit 1; fi
            (umask 022; printf '%s\n' "$DATABASE_CA_CERT" > db-ca.crt)
            # The droplet's own login, by stdin so the token is never an argument; logged out after.
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull web
            docker logout ghcr.io
            # Forward-only migrations with lock_timeout (CLAUDE.md rule 16). A failure stops the
            # release here and the previous containers keep serving.
            docker compose --profile release run --rm migrate
            docker compose up -d --remove-orphans web worker caddy
            # A bind-mounted Caddyfile change is invisible to `up`; a fresh container's admin API can
            # take a moment to listen.
            for i in 1 2 3 4 5; do
              docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile && break
              sleep 2
            done
            for i in $(seq 1 40); do
              if docker compose exec -T web node -e "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"; then
                echo "Healthy after $i checks"
                docker image prune -f
                exit 0
              fi
              sleep 3
            done
            echo 'web did not become healthy within 2 minutes'
            docker compose logs --tail=60 web worker
            exit 1
