# ADR-051: the docs site (apps/docs) to docs.comprobify.com, the comprobify-docs Cloudflare Pages
# project, when a merge to main changes it. Repository secrets DOCS_CLOUDFLARE_API_TOKEN (Cloudflare
# Pages: Edit, on this account) and DOCS_CLOUDFLARE_ACCOUNT_ID.
name: Docs

on:
  push:
    branches: [main]
    paths: ['apps/docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @comprobify/docs
      - run: pnpm --filter @comprobify/docs build
      # Pinned to a commit: the step holds the Cloudflare token.
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.DOCS_CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.DOCS_CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/docs/.vitepress/dist --project-name=comprobify-docs --branch=main
