# ADR-051: the docs site (apps/docs) to docs.comprobify.com, the comprobify-docs Cloudflare Pages
# project, when a merge to main changes it. Repository secrets DOCS_CLOUDFLARE_API_TOKEN (Cloudflare
# Pages: Edit, on this account) and DOCS_CLOUDFLARE_ACCOUNT_ID.
name: Docs

on:
  push:
    branches: [main]
    paths: ['apps/docs/**', '.github/workflows/docs.yml']
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @comprobify/docs
      - run: pnpm --filter @comprobify/docs build
      # The package's own pinned wrangler: wrangler-action installs one itself, which a pnpm
      # workspace root refuses (ERR_PNPM_ADDING_TO_ROOT), and it would hold the token besides.
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DOCS_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DOCS_CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @comprobify/docs exec wrangler pages deploy .vitepress/dist --project-name=comprobify-docs --branch=main
