# ADR-051: what a merge to main does, in one run. The E2E smoke test (the pull request's other checks
# already passed on the same code), and, while staging is up (STAGING_INFRA_ENABLED), Terraform
# when the merge changed infra/terraform, once its reviewer approves. It deploys nothing: staging is
# deployed by hand (deploy-staging.yml), production by a release (production.yml). A merge that
# changes only docs starts no run.
name: Main

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'apps/docs/**', '**/*.md']

# One merge at a time; a newer one waits rather than cancelling an apply halfway.
concurrency:
  group: main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # Did this push change the infrastructure? Compared with what main was before it.
  changes:
    if: vars.STAGING_INFRA_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.diff.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A new branch or a rewritten history has no usable "before": plan it to be sure.
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo infra=true >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BEFORE" "$GITHUB_SHA" -- infra/terraform; then
            echo infra=false >> "$GITHUB_OUTPUT"
          else
            echo infra=true >> "$GITHUB_OUTPUT"
          fi

  terraform:
    needs: [ci, changes]
    if: needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/infrastructure-job.yml
    with:
      environment: staging
      action: apply
    secrets: inherit
